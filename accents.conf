# Oh là là: characters offered when a letter is held.
#
#   <letter> = <char> <char> ...
#
# Order is the popup order (1, 2, 3...). Capitals are derived automatically
# (holding Shift+a shows Ä À ...); add an uppercase line to override them.
#
# Edit your copy at ~/.config/ohlala/accents.conf. Changes to existing letters
# apply on the next popup. After adding or removing a letter, run
# `bin/ohlala setup` (in the plugin folder) again so keyd watches it.

a = ä à á â ã å æ ā ą
e = € é è ê ë ē ė ę
i = í ì î ï ī į
o = ö ó ò ô õ ø œ ō
u = ü ú ù û ū
c = č ć ç
s = š ß ś
S = Š ẞ Ś
z = ž ź ż
d = đ
n = ñ ń
y = ÿ ý
l = ł
